name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-release-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_public_release.py --history

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet ruff==0.17.4
      - run: ruff check .
      - run: docker compose config --quiet

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: >-
          python -m pip install
          -r requirements-api.txt
          -r requirements-mcp.txt
          -r requirements-automation.txt
          -r requirements-observability-control.txt
      - run: python -m unittest discover -s tests -v
        env:
          ANSIBLE_LOCAL_TEMP: /tmp/agentswatch-ansible-local
          ANSIBLE_REMOTE_TEMP: /tmp/agentswatch-ansible-remote
          PYTHONDONTWRITEBYTECODE: "1"

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
