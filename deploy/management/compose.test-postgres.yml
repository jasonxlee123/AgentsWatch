name: agentswatch-management-test-postgres

services:
  management-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${AGENTSWATCH_TEST_POSTGRES_DB:?set AGENTSWATCH_TEST_POSTGRES_DB}"
      POSTGRES_USER: "${AGENTSWATCH_TEST_POSTGRES_USER:?set AGENTSWATCH_TEST_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${AGENTSWATCH_TEST_POSTGRES_PASSWORD:?set AGENTSWATCH_TEST_POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:${AGENTSWATCH_POSTGRES_PORT:-55432}:5432"
    volumes:
      - /data/agentswatch/management/postgres:/var/lib/postgresql/data:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    networks:
      - test-postgres

networks:
  test-postgres:
