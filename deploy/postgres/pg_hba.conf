# Local socket access is reserved for container-local maintenance.
local   all             all                                     trust

# The service has no published port and is attached only to the internal
# agentswatch-database network. All network clients must still use TLS and
# SCRAM; database object privileges enforce reader/writer boundaries.
hostnossl all           all             0.0.0.0/0               reject
hostnossl all           all             ::/0                    reject
hostssl  agentswatch    all             0.0.0.0/0               scram-sha-256
hostssl  agentswatch    all             ::/0                    scram-sha-256
host     all            all             0.0.0.0/0               reject
host     all            all             ::/0                    reject
