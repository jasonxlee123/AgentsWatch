user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /dev/stdout main;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  upstream grafana_backend {
    server grafana:3000;
    keepalive 32;
  }

  upstream observability_control_backend {
    server observability-control:8011;
    keepalive 8;
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    # Baseline browser hardening for both Grafana and the management UI.
    # Grafana needs inline scripts and websockets, so a strict CSP is applied
    # only to the management location below instead of globally.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 'ok\n';
    }

    # Optional site compatibility routes are mounted only by explicit Compose
    # overlays. A wildcard include with no matches leaves the default ingress
    # unchanged.
    include /etc/nginx/optional/*.conf;

    location = /agentswatch {
      return 308 /agentswatch/;
    }

    location ^~ /agentswatch/ {
      # A location-level add_header replaces inherited headers, so repeat the
      # baseline set here together with the management-only CSP.
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
      proxy_pass http://unix:/data/agentswatch/management/run/api.sock:/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
    }

    location = /agentswatch-mcp {
      return 308 /agentswatch-mcp/;
    }

    location ^~ /agentswatch-mcp/ {
      proxy_pass http://unix:/data/agentswatch/management/run/mcp.sock:/;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:8010;
      proxy_set_header Origin http://127.0.0.1:8010;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_cache off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    location /api/live/ {
      proxy_pass http://grafana_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_read_timeout 3600s;
    }

    location / {
      proxy_pass http://grafana_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header Connection '';
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }

  # This listener is available only on the two Compose backend networks. It is
  # intentionally not published on the host; management reaches the operations
  # adapter through the same Nginx process without exposing its control API.
  server {
    listen 8080;
    server_name _;
    access_log off;

    location / {
      proxy_pass http://observability_control_backend;
      proxy_http_version 1.1;
      proxy_set_header Host observability-control:8011;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }
  }
}
