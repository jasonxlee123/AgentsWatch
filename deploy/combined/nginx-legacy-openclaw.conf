location = /openclaw {
  return 308 /openclaw/;
}

location ^~ /openclaw/ {
  auth_basic "AgentsWatch legacy OpenClaw access";
  auth_basic_user_file /etc/nginx/auth/agentswatch.htpasswd;

  proxy_pass http://unix:/data/agentswatch/management/run/openclaw.sock:/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  # Basic Auth protects this ingress only. Never disclose those credentials to
  # the loopback OpenClaw service or let them override its own auth contract.
  proxy_set_header Authorization "";
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_connect_timeout 5s;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}
