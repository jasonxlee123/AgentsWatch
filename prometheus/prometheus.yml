global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: lobster-observability
    replica: prometheus-1

rule_files:
  - /etc/prometheus/alerts/*.yml
  - /etc/prometheus/agentswatch-control/current/*.rules.yml

scrape_config_files:
  - /etc/prometheus/agentswatch-control/current/openclaw-gateways.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: otel-collector-self
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: otel-collector-openclaw-metrics
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:9464"]

  - job_name: thanos
    static_configs:
      - targets:
          - thanos-sidecar:10902
          - thanos-store:10902
          - thanos-query:10902
          - thanos-compact:10902

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
