---
- name: Bootstrap a server from password login to managed public-key login
  hosts: all
  gather_facts: false
  tasks:
    - name: Ensure Python 3 is available for subsequent Ansible modules
      ansible.builtin.raw: |
        set -eu
        if command -v python3 >/dev/null 2>&1; then
          exit 0
        elif command -v apt-get >/dev/null 2>&1; then
          DEBIAN_FRONTEND=noninteractive apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3
        elif command -v dnf >/dev/null 2>&1; then
          dnf install -y python3
        elif command -v yum >/dev/null 2>&1; then
          yum install -y python3
        elif command -v apk >/dev/null 2>&1; then
          apk add --no-cache python3
        else
          echo "Python 3 is missing and no supported package manager was found" >&2
          exit 42
        fi
      become: "{{ ansible_become | default(false) }}"
      changed_when: false

    - name: Install the AgentsWatch management public key for the login account
      ansible.builtin.raw: |
        set -eu
        umask 077
        mkdir -p "$HOME/.ssh"
        touch "$HOME/.ssh/authorized_keys"
        chmod 700 "$HOME/.ssh"
        chmod 600 "$HOME/.ssh/authorized_keys"
        key={{ agentswatch_bootstrap_public_key | quote }}
        grep -qxF "$key" "$HOME/.ssh/authorized_keys" || printf '%s\n' "$key" >> "$HOME/.ssh/authorized_keys"
      become: false
      no_log: true
      changed_when: true

    - name: Return bootstrap result
      ansible.builtin.set_fact:
        agentswatch_result:
          public_key_installed: true
          python_ready: true
