target-version = "py312"
line-length = 120

[lint]
# Start with rules that catch real defects (undefined names, unused imports,
# syntax-adjacent errors) instead of a wholesale style rewrite.
select = ["E4", "E7", "E9", "F"]
exclude = [
  ".venv*",
  "dist",
  "frontend/node_modules",
  "frontend/dist",
]
