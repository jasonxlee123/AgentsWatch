extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol
    create_directory: true

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        include_metadata: true

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: ${env:OTEL_MEMORY_LIMIT_MIB}
    spike_limit_mib: 256

  resource/lobster_identity:
    attributes:
      - key: gateway_id
        from_context: metadata.x-openclaw-gateway-id
        action: upsert
      - key: service.instance.id
        from_context: metadata.x-openclaw-gateway-id
        action: upsert
      - key: runtime_id
        from_context: metadata.x-agentswatch-runtime-id
        action: upsert
      - key: server_id
        from_context: metadata.x-agentswatch-server-id
        action: upsert
      - key: primary_agent_id
        from_context: metadata.x-agentswatch-primary-agent-id
        action: upsert
      - key: agent_deployment_id
        from_context: metadata.x-agentswatch-agent-deployment-id
        action: upsert
      - key: service.instance.id
        from_context: metadata.x-agentswatch-runtime-id
        action: upsert

  attributes/drop_metric_cardinality:
    actions:
      - key: trace_id
        action: delete
      - key: span_id
        action: delete
      - key: session_id
        action: delete
      - key: user_id
        action: delete
      - key: request_id
        action: delete
      - key: conversation_id
        action: delete

  attributes/drop_sensitive_log_fields:
    actions:
      - key: prompt
        action: delete
      - key: completion
        action: delete
      - key: request.body
        action: delete
      - key: response.body
        action: delete
      - key: tool.input
        action: delete
      - key: tool.output
        action: delete
      - key: api_key
        action: delete
      - key: authorization
        action: delete

  batch:
    timeout: 5s
    send_batch_size: 8192
    send_batch_max_size: 16384

exporters:
  prometheus:
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion:
      enabled: true

  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 10000
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s

  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 10000
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s

  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s&compress=lz4
    database: ${env:CLICKHOUSE_DATABASE}
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    ttl: ${env:CLICKHOUSE_TTL}
    create_schema: true
    async_insert: true
    sending_queue:
      enabled: true
      storage: file_storage
      sizer: items
      queue_size: 100000
      num_consumers: 4
      batch:
        min_size: 5000
        flush_timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0s

service:
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

  extensions: [health_check, file_storage]

  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/lobster_identity, attributes/drop_metric_cardinality, batch]
      exporters: [prometheus]

    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/lobster_identity, batch]
      exporters: [otlp_grpc/tempo]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/lobster_identity, attributes/drop_sensitive_log_fields, batch]
      exporters: [otlp_http/loki]

    metrics/archive:
      receivers: [otlp]
      processors: [memory_limiter, resource/lobster_identity]
      exporters: [clickhouse]

    traces/archive:
      receivers: [otlp]
      processors: [memory_limiter, resource/lobster_identity]
      exporters: [clickhouse]

    logs/archive:
      receivers: [otlp]
      processors: [memory_limiter, resource/lobster_identity, attributes/drop_sensitive_log_fields]
      exporters: [clickhouse]
